# ═══════════════════════════════════════════════════════════════════════════
#  Authent — docker-compose para PRODUCCIÓN (image-based)
#
#  El servicio `web` consume la imagen pre-construida desde GHCR.
#  Para builds locales/dev seguir usando docker-compose.yml.
#
#  Variables clave (definidas en .env generado en CI):
#    BACKEND_IMAGE_TAG  → tag de la imagen a desplegar (default: latest)
#    ATHARIX_SHARED_*   → red compartida con otros servicios atharix
# ═══════════════════════════════════════════════════════════════════════════

name: authent

services:
  db:
    image: postgres:15-alpine
    container_name: authent_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-authent_prod}
      POSTGRES_USER: ${DB_USER:-authent_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=32MB
        -c maintenance_work_mem=128MB
        -c max_connections=200
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-authent_user} -d ${DB_NAME:-authent_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authent_network

  redis:
    image: redis:7-alpine
    container_name: authent_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 150M
    networks:
      - authent_network

  web:
    image: ghcr.io/atharix/authent:${BACKEND_IMAGE_TAG:-latest}
    container_name: authent_web
    restart: unless-stopped
    command: ./start-web.sh
    volumes:
      - static_volume:/app/config/staticfiles
      - media_volume:/app/config/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.${ENVIRONMENT:-prod}
      DB_HOST: db
      DB_PORT: 5432
    env_file:
      - .env
      - app/envs/${ENVIRONMENT:-prod}.env
    ports:
      - "8004:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - authent_network
      - atharix_shared

  celery_worker:
    image: ghcr.io/atharix/authent:${BACKEND_IMAGE_TAG:-latest}
    container_name: authent_celery_worker
    restart: unless-stopped
    command: sh -c "mkdir -p /app/config/logs && celery -A config worker -l info --concurrency=2"
    volumes:
      - media_volume:/app/config/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.${ENVIRONMENT:-prod}
      DB_HOST: db
      DB_PORT: 5432
    env_file:
      - .env
      - app/envs/${ENVIRONMENT:-prod}.env
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - authent_network
      - atharix_shared

  caddy:
    image: caddy:2-alpine
    container_name: authent_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FRONTEND_DIR:-./frontend}:/srv/frontend:ro
      - static_volume:/srv/staticfiles:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      web:
        condition: service_started
    networks:
      - authent_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:

networks:
  authent_network:
    driver: bridge
  atharix_shared:
    name: ${ATHARIX_SHARED_NETWORK_NAME:-atharix_shared}
    external: ${ATHARIX_SHARED_EXTERNAL:-true}
